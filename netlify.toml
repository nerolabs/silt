# Deploy config for the Silt website, versioned in the repo so the build
# is reproducible and reviewable. Netlify's Git integration reads this:
#   push to main      → production  (silthq.com)
#   push to staging   → branch deploy (staging--<site>.netlify.app,
#                       or staging.silthq.com if you add the CNAME)
#   pull request      → deploy preview (a unique URL, posted on the PR)
#
# The build step GENERATES the three derived pages — changelog.html,
# roadmap.html and buildlog.html — from their Markdown sources. Those three
# files are gitignored and exist nowhere in the repo: this build is the only
# thing that produces them, so the published pages cannot drift from the
# sources, and two PRs whose Markdown edits do not overlap can no longer
# collide in a committed derivative (D-WEBSITE-HTML-AT-DEPLOY-2026-09-12).
#
# If any generator fails the deploy fails, which is the behaviour we want:
# index.html, docs.html and node.html all link to these pages, so a partial
# build would break site navigation, not merely orphan three URLs.

[build]
  command = "python3 scripts/gen_changelog.py && python3 scripts/gen_roadmap.py && python3 scripts/gen_buildlog.py"
  publish = "website"

[build.environment]
  PYTHON_VERSION = "3.12"

# Canonical host is the bare apex. Send www there.
[[redirects]]
  from = "https://www.silthq.com/*"
  to = "https://silthq.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
