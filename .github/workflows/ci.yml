name: CI

# Gates every push and pull request: the Go suite (with a coverage
# floor), formatting, a race-detector build, the `bbootstrap` build-tag
# variant (D-BB-BUILD-TAG), a link-check plus changelog/roadmap freshness
# for the website, and a docs-ship-with-code check that a code change also
# touches the changelog. Branch protection should require these before
# merging to main or staging.
on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  go:
    name: Go — vet, fmt, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^dist/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: cloudtest shell lint (no unbraced $var before a multibyte char — bash-3.2 set -u crash, P1 b525b0b)
        run: ./integration/cloudtest/check_shell_multibyte.sh
      - name: cloudtest local-proof parity lint (every graded flow declares its LOCAL_PROOF or an explicit n/a)
        run: ./integration/cloudtest/check_local_proofs.sh
      - name: cloudtest escape-fingerprint self-test (#536 — rc from debug.log not journald; UNKNOWN never 0)
        run: ./integration/cloudtest/check_escape_fingerprint.sh
      - name: go test + coverage floor
        run: |
          # -coverpkg=./... credits cross-package coverage, so the pure
          # core packages (exercised by the sim, which has no unit tests of
          # its own) count toward the total instead of showing as 0%.
          # -short skips the process-spawning e2e suite (its own job below);
          # e2e drives the built binary and adds no in-process coverage.
          go test -short -coverpkg=./... -coverprofile=cover.out ./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          floor=60.0
          echo "total coverage: ${total}% (floor ${floor}%)"
          if awk "BEGIN {exit !($total < $floor)}"; then
            echo "::error::coverage ${total}% is below the ${floor}% floor"; exit 1
          fi
      # THE UNTAGGED R2.9a GATES CARRY THE LOAD FOR KEEPING THE INSTRUMENT OUT OF A DEFAULT
      # BUILD, and nothing above asserts they still exist by name: `go test` reports a
      # renamed or deleted test as nothing at all, and a t.Skip as a pass, so a rename
      # would go unnoticed by every job. Same treatment as the tagged job below — named
      # anchors, one per untagged gate, no skip. Rename a gate: update this list in the
      # same commit.
      - name: the untagged R2.9a gates really ran (not renamed away, not skipped)
        run: |
          out=$(go test -short -count=1 -v ./core/credit/ ./core/node/ ./cmd/silt/ -run 'R29a|Privacy' 2>&1)
          echo "$out"
          for tst in \
            TestR29aDefaultBuildStampsNoFirstTouchOnRegister \
            TestR29aBondChallengeStampsNoFirstTouch \
            TestR29aRetentionReadsLastBondTickInNanoseconds \
            TestR29aLedgerStateIsEmptyInADefaultBuild \
            TestR29aDefaultBuildHasNoCensusReaderOnTheLedger \
            TestR29aBondAuditStampsAWallClockNanosecondNotACounter \
            TestR29aDefaultBuildHasNoBBootstrapReaderOnTheNode \
            TestR29aDefaultBuildHasNoBBootstrapFlag \
            TestR29aDaemonHandsTheNodeAWallClock \
            TestR29aDefaultBuildStatusHasNoBBootstrapKey \
            TestR29aWalltimeAdapterIsAWallClock \
            TestR29aBB21StaleIsIdentifiableAsStale \
            TestR29aBB21OperatorsOwnWriteIsNotHiddenByTheCache \
            TestR29aF2StatusWithholdsPerObjectDetailWithoutAToken \
            TestR29aF2EconomySelfWithholdsPerObjectDetailWithoutAToken \
            TestR29aF2NoUnauthenticatedResponseOnTheWholeSurfaceCarriesTheWithheldCounter \
            TestR29aOneCacheTwoViewsAnAnonymousReadDoesNotStripTheOperatorsView \
            TestR29aEconomySelfIsServedFromTheStatusSnapshot \
            TestPrivacyStatusWithholdsCountersFromUnauthenticatedReaders \
            TestPrivacyZeroBalanceIsPublishedNotOmitted \
            TestPrivacyEconomySelfIsAnAllowList \
            TestPrivacyEconomySelfViewIsSpelledAsAnAllowList \
            TestPrivacyLibraryLinkTakesTheHeaderPredicate \
            TestPrivacyFlagRefusesAnythingButOnOrOff \
            TestPrivacyBothSubcommandsParseTheFlagBeforeServing \
            TestPrivacyAllThreeHandlersRouteThroughTheirView \
            TestPrivacyPagesRenderWithheldDocumentsWithoutThrowing \
            TestPrivacyWithheldDocumentsCarryOnlyAllowedKeys \
            TestPrivacyWithholdDoesNotPoisonTheSharedCache ; do
            echo "$out" | grep -q "^--- PASS: ${tst} " || {
              echo "::error::${tst} did not PASS in the DEFAULT build. Either it was renamed (fix this list), it was skipped, or the default build lost the gate."; exit 1; }
          done
          if echo "$out" | grep -q '^--- SKIP'; then
            echo "::error::an untagged R2.9a gate SKIPPED. A skipped gate is a gate that rots."
            echo "$out" | grep '^--- SKIP'; exit 1
          fi
          echo "OK — every named untagged gate ran and passed"
      # EVERY OTHER `go test` IN THIS FILE PASSES `-short`, AND THESE FIVE TESTS SKIP
      # UNDER IT. Measured: they executed in NO CI job at all — `--- SKIP` on each, exit
      # 0, a green check standing for zero execution (scar:short-run-is-zero-execution-
      # 2026-09-10, count 2; instance 1 was a seat choosing -short by hand, this one is
      # the workflow itself, so it recurred on every push). NO `-short` here, deliberately.
      #
      # These are the ones that ASSERT, so a skip costs real coverage. Four carry
      # substantive t.Fatalf regressions: the nested-evidence fixed point ("Q2/Q3
      # REGRESSED"), the #563 field-confirmed OOM budget ("#563 REPRODUCED"), the C3
      # serve-Gini honest-null pin, and the §0.1 reconstruct resident floor. The fifth,
      # TestSlashesBytesCapWorstCaseCost, asserts only PRECONDITIONS — its four figures
      # go through t.Logf, so running it buys execution, not protection of the numbers
      # (said in full at core/chain.SlashesBytesCap). It is here because it is the
      # derivation witness for a FROZEN era-4 parameter and must at least run.
      #
      # NOT in the race job: TestReconcileMemoryBounded_563 self-skips under -race too,
      # so -race would put it straight back in the dark.
      #
      # Measured on a throttled 2-core box: 36.9 s of test time, 58 s wall including the
      # test-binary builds. TestRNestGate_SelfArmorMeasurement dominates at 28-30 s; the
      # other four total ~6 s. -timeout 20m leaves headroom on a slower runner.
      #
      # scripts/check_short_dark_tests.py READS THIS `-run` LIST as the source of truth
      # for what runs unshortened. Dropping a name here does not just lose the run — it
      # turns that test dark, and the lint goes red in the website job.
      - name: the -short-dark asserting tests really ran (no other job executes these)
        run: |
          out=$(go test -count=1 -v ./core/chain/ ./cmd/silt/ ./core/erasure/ -run '^(TestRNestGate_SelfArmorMeasurement|TestGateC3_1_ServeGiniHonestNullIsMixDependentNotSampleSizeDependent|TestReconcileMemoryBounded_563|TestSlashesBytesCapWorstCaseCost|TestReconstructMemoryFootprint_SimVsProd)$' -timeout 20m 2>&1)
          echo "$out"
          for tst in \
            TestRNestGate_SelfArmorMeasurement \
            TestGateC3_1_ServeGiniHonestNullIsMixDependentNotSampleSizeDependent \
            TestReconcileMemoryBounded_563 \
            TestSlashesBytesCapWorstCaseCost \
            TestReconstructMemoryFootprint_SimVsProd ; do
            echo "$out" | grep -q "^--- PASS: ${tst} " || {
              echo "::error::${tst} did not PASS unshortened. Either it was renamed (fix BOTH lists in this step), it skipped, or it failed. A -run filter matching nothing still exits 0, which is why this asserts by name."; exit 1; }
          done
          if echo "$out" | grep -q '^--- SKIP'; then
            echo "::error::a test SKIPPED in the step whose entire purpose is that these do not skip."
            echo "$out" | grep '^--- SKIP'; exit 1
          fi
          echo "OK — five formerly-dark tests executed unshortened, none skipped"

  race:
    name: Go — race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go test -race
        # -short skips e2e: its subprocesses aren't race-instrumented, so
        # the coverage isn't worth the minutes; the dedicated e2e job runs
        # the full form.
        run: go test -race -short ./...

  bbootstrap:
    name: Go — the `bbootstrap` build tag (D-BB-BUILD-TAG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # THE DEFAULT BINARY MUST CONTAIN NO PART OF THE INSTRUMENT. This is the half of
      # D-BB-BUILD-TAG that no Go test can assert, because a test that can see the
      # symbol is running in the build that has it. It reads the linked binary instead.
      - name: A default silt binary carries no B_bootstrap mechanism
        run: |
          go build -o /tmp/silt-default ./cmd/silt
          syms=$(go tool nm /tmp/silt-default | grep -i 'bbootstrap' || true)
          if [ -n "$syms" ]; then
            echo "::error::a DEFAULT silt binary contains B_bootstrap symbols. TENETS Part VI Don't #3 is a claim about what silt BUILDS; the instrument must compile only under -tags bbootstrap (D-BB-BUILD-TAG, docs/decisions.md)."
            echo "$syms"; exit 1
          fi
          # And the flag must not exist. Not "default false" — absent.
          if /tmp/silt-default daemon -help 2>&1 | grep -q 'bbootstrap'; then
            echo "::error::a DEFAULT silt binary declares -bbootstrap. The mechanism must be absent, not disabled."; exit 1
          fi
          if ! /tmp/silt-default daemon -bbootstrap 2>&1 | grep -q 'flag provided but not defined: -bbootstrap'; then
            echo "::error::a DEFAULT silt binary did not REJECT -bbootstrap as an unknown flag."; exit 1
          fi
          echo "OK — default binary: no symbols, no flag, rejects -bbootstrap"
      - name: go vet -tags bbootstrap
        run: go vet -tags bbootstrap ./...
      # A BUILD TAG CI NEVER COMPILES IS CODE THAT ROTS. Everything R2.9a shipped — the
      # minimum-requester floor, the G-BB-11' construct-from-the-instrument-class
      # property, the BB-20 wire-equivalence gate, the two-clock cross-check and the
      # package-scope export gate — now runs ONLY here. The `go` job above cannot see
      # any of it.
      - name: go test -tags bbootstrap -short ./...
        run: go test -tags bbootstrap -short -count=1 ./...
      # AND PROVE THE TAGGED TESTS ACTUALLY RAN. `go test -run` on a package with zero
      # matches still exits 0, and a t.Skip is also a pass — so a green step above is
      # not on its own evidence that the instrument's gates executed. This asserts named
      # anchors, one per surviving gate family, and refuses any skip.
      - name: the tagged gates really ran (not filtered out, not skipped)
        run: |
          out=$(go test -tags bbootstrap -short -count=1 -v ./core/credit/ ./core/node/ ./cmd/silt/ -run 'R29a' 2>&1)
          echo "$out"
          for tst in \
            TestR29aTheFlagGatesTheRecordingNotJustThePublication \
            TestR29aFlippingTheFlagOnDoesNotRecoverThePastIsTheACCEPTEDCOST \
            TestR29aBB15FloorWithholdsEveryCensusCountBelowRMin \
            TestR29aBB15FloorIsDerivedNotChosen \
            TestR29aBB20BelowFloorBlockIsAFunctionOfTheClockAlone \
            TestR29aBB20HasTeeth \
            TestR29aBBootstrapHasOneExportedRoute \
            TestR29aExportRouteGateHasTeeth \
            TestR29aWallClockStepIsDetectedNotAbsorbed \
            TestR29aOccupiedAgeBucketsNeverExceedUptime \
            TestR29aBBootstrapSnapshotWritesNothing \
            TestR29aDaemonInjectsBothClocksBeforeTheLedgerIsReachable \
            TestR29aByteBinMatchesTheClosedForm \
            TestR29aTopBinSaturatesThroughTheSnapshot \
            TestR29aBB16PolledSeriesRevealsNoSingleIdentityTrajectory \
            TestR29aG12RoutableBindWithBBootstrapIsRefusedAtStartup \
            TestR29aG12DaemonRefusesBeforeItBindsOrMintsAToken \
            TestR29aG12ClientSubcommandWiresNoInstrument \
            TestR29aG12ThreeWireStatesAreDistinctKeySets \
            TestR29aG12QueryTokenDoesNotUnlockTheBlock \
            TestR29aG12ProxyUpstreamHostAndLocalOriginReadWithheld \
            TestR29aG12WithholdingDoesNotPoisonTheSharedCache \
            TestR29aG12InsecureTokenFileIsRefusedAtStartup \
            TestR29aG12ReaderViewIsTheOneCompositionPoint \
            TestR29aG12TokenFileMustBeTheDaemonUsers ; do
            echo "$out" | grep -q "^--- PASS: ${tst} " || {
              echo "::error::${tst} did not PASS under -tags bbootstrap. Either it was renamed (fix this list), it was skipped, or the tagged build lost the gate."; exit 1; }
          done
          if echo "$out" | grep -q '^--- SKIP'; then
            echo "::error::a tagged R2.9a gate SKIPPED. A skipped gate is a gate that rots."
            echo "$out" | grep '^--- SKIP'; exit 1
          fi
          echo "OK — every named tagged gate ran and passed"


  reachability:
    name: Go — every claimed lane is IN the linked binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # THE OTHER DIRECTION OF THE bbootstrap CHECK ABOVE. That step reads the linked
      # binary to prove a mechanism is ABSENT; this one reads it to prove the lanes the
      # release checklist makes a public claim about are PRESENT — or that the checklist
      # says outright that they cannot be exercised.
      #
      # Six mechanisms shipped inert this month: present in source, recorded as
      # delivered and enforcing, zero non-test callers, so the linker dropped every one.
      # No Go test can catch that; a test that can see the symbol is itself the caller
      # that keeps it alive. A grep sweep cannot catch it either — it keys on bare
      # identifiers, so an inert method hides behind a live namesake (it missed
      # demand.Commit outright). `go tool nm` on the linked binary has neither hole.
      - name: Scar-lint — a lane the release checklist claims must be reachable in ./cmd/silt (scar:mechanism-shipped-inert-2026-09-10)
        run: python3 scripts/check_reachability.py

  e2e:
    name: Go — multi-process e2e (real TCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go test ./e2e
        # Builds the silt binary and drives real daemons over TCP:
        # publish → chain-commit → fetch, bit-perfect. This is the layer
        # the in-process sim skips — the class of bug #36 was.
        # -timeout 25m: the economy repair test's pay window is 600s (the
        # measured sweep-under-dead-holders band, #501/#497) — go test's
        # default 10m killed the binary mid-window (a sleeping-goroutine
        # panic at the poll loop, not a test verdict).
        run: go test ./e2e/ -count=1 -v -timeout 25m
      - name: go test -race ./e2e (in-process paid-relay seam)
        # The paid-relay e2e (TestPaidRelaySessionEndToEnd) is IN-PROCESS: it
        # runs real event loops + goroutines in this test binary, not spawned
        # daemons, so -race applies (unlike the subprocess-driven e2e above,
        # which the top-level `race` job's -short correctly skips). The ledger
        # is loop-only (no mutex); a test reading it off-loop trips a data race.
        # This step keeps that regression caught in CI — the -short race job
        # never sees this test because it t.Skips under -short.
        # The explicit -run pins the ONE in-process test; if it is renamed and
        # this filter stops matching, `go test` fails the step with
        # "no tests to run" NOT silently — `-run` on a package with zero
        # matches still exits 0, so we assert a match by requiring -v output.
        run: |
          out=$(go test -race ./e2e/ -run '^TestPaidRelaySessionEndToEnd$' -count=1 -v -timeout 10m 2>&1)
          echo "$out"
          echo "$out" | grep -q '^=== RUN   TestPaidRelaySessionEndToEnd$' || {
            echo "::error::the paid-relay -race step matched NO test — the -run filter is stale (was the test renamed?)"; exit 1; }

  nat-integration:
    name: Integration — cross-NAT over a real relay (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Cross-NAT publish → fetch through the relay (+ restart survival)
        # Stands up two NATed daemons + a public relay in real container
        # networks (real kernel NAT via iptables MASQUERADE), publishes from
        # behind NAT A and fetches from behind NAT B, asserting bit-perfect
        # across the relay. This is the automatable replacement for the
        # manual two-machine (Mac A ↔ Mac B) rig — the layer that proves the
        # relay/NAT path, which flat-localhost e2e can't. Docker + compose
        # are preinstalled on ubuntu-latest. RESTART=1 also restarts the whole
        # swarm and re-fetches, gating the #69 reprovide-on-restart fix.
        run: RESTART=1 ./integration/nat/run.sh

  nat-holepunch:
    name: Integration — NAT hole-punch (cone punches, symmetric falls back)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Cone NAT is punchable — raw primitive (direct connection through both NATs)
        run: ./integration/nat/probe.sh
      - name: Symmetric NAT defeats the punch — raw primitive (relay fallback is genuinely needed)
        run: NAT_MODE=symmetric ./integration/nat/probe.sh
      - name: Two NATed DAEMONS upgrade the relay path to direct (integrated, #27/#111)
        # The integrated path — caretaker traffic triggers the relay-coordinated
        # punch and both daemons go direct — not just the standalone probe. This
        # is the regression gate for #111 (the punch was never firing, then never
        # binding): a re-break fails here, locally and in CI (build-immutable V5).
        run: ./integration/nat/holepunch.sh
      - name: Symmetric NAT — integrated daemons correctly stay on the relay
        run: NAT_MODE=symmetric ./integration/nat/holepunch.sh

  website:
    name: Website — changelog + links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate changelog page
        run: python3 scripts/gen_changelog.py
      - name: Fail if changelog page is stale
        run: |
          if ! git diff --quiet -- website/changelog.html; then
            echo "website/changelog.html is out of date; run scripts/gen_changelog.py and commit."
            git --no-pager diff -- website/changelog.html
            exit 1
          fi
      - name: Generate roadmap page
        run: python3 scripts/gen_roadmap.py
      - name: Fail if roadmap page is stale
        run: |
          if ! git diff --quiet -- website/roadmap.html; then
            echo "website/roadmap.html is out of date; run scripts/gen_roadmap.py and commit."
            git --no-pager diff -- website/roadmap.html
            exit 1
          fi
      - name: Generate build-log page
        run: python3 scripts/gen_buildlog.py
      - name: Fail if build-log page is stale
        run: |
          if ! git diff --quiet -- website/buildlog.html; then
            echo "website/buildlog.html is out of date; run scripts/gen_buildlog.py and commit."
            git --no-pager diff -- website/buildlog.html
            exit 1
          fi
      - name: Check internal links resolve
        run: python3 scripts/check_links.py
      - name: Truth-in-labelling — every ledgered claim has a backing test
        run: python3 scripts/check_claims.py
      - name: Scar-lint — TENETS.md Sybil-composition must carry design-target qualifier (scar:sybil-design-target-overclaim-2026-09-01)
        run: python3 scripts/check_tenet_qualifiers.py
      - name: Scar-lint — no doc's not-built Status header may contradict a built/shipped body (scar:status-header-vs-body-contradiction-2026-09-01)
        run: python3 scripts/check_status_headers.py
      - name: Scar-lint — every cited test name must resolve to a real test, and every symbol-anchored source coordinate must point at its symbol (scar:cited-test-does-not-exist-2026-09-02, scar:cited-source-coordinate-decayed-2026-09-10)
        # External review trees are absent in CI, so this checks the repo only.
        run: python3 scripts/check_cited_tests.py
      - name: Scar-lint — a source-text test gate must be labelled and must name its runtime cover (scar:source-gate-promises-a-runtime-property-2026-09-03)
        run: python3 scripts/check_source_gates.py
      - name: Scar-lint — no unresolved merge-conflict marker may reach a branch (scar:conflict-markers-shipped-in-ci-yml-2026-09-03)
        run: python3 scripts/check_conflict_markers.py
      - name: Scar-lint — every residual named in ROADMAP.md has a register row with a bucket and a closer (scar:residual-backlog-unbucketed-2026-09-06)
        run: python3 scripts/check_residual_register.py
      - name: Scar-lint — no test may skip under -short in every merge-gating job (scar:short-run-is-zero-execution-2026-09-10)
        run: python3 scripts/check_short_dark_tests.py

  docs-shipped:
    name: Docs ship with code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # check_scheduled_workflow_proof.py resolves a run id via the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG entry when code changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request — nothing to enforce"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "changed files:"; echo "$files"
          code=$(echo "$files" | grep -E '^(cmd|core|adapters)/' || true)
          if [ -n "$code" ] && ! echo "$files" | grep -qx 'CHANGELOG.md'; then
            echo "::error::Code under cmd/, core/, or adapters/ changed but CHANGELOG.md was not updated. Add a line to the '## [Unreleased]' section (and re-run scripts/gen_changelog.py)."
            echo "code files that triggered this:"; echo "$code"
            exit 1
          fi
          echo "OK — docs ship with code"
      - name: Scar-lint — a changed SCHEDULED workflow must show a verified green workflow_dispatch run (scar:scheduled-workflow-never-observed-green-2026-09-11)
        # nightly-netem merged inside an omnibus commit, was red on its FIRST cron
        # run, and stayed red 19 of its first 21 — it had never been watched.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_scheduled_workflow_proof.py
