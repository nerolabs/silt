# Byzantine red-team on a flat Docker net (validator accountability).
#
# One honest bonded quorum + three concrete, wire-reachable adversaries. Every
# daemon is a REAL silt process talking over REAL TCP on one bridge network —
# no in-process sim, no simulated flags. The adversarial behaviors are the
# repo's own ADVERSARY / TEST-HARNESS flags (`silt daemon -h`):
#
#  -equivocate "idX,idYZ" double-sign at height 1 (honest replicas slash it)
#  -forge-block <peerID> proposal with a FORGED proposer sig (honest rejects)
#  -lowbond-propose <peerID> under-bonded proposer (honest refuses to attest)
#
# The honest validators use the earned-bonded-standing recipe the e2e tests and
# examples/flow4 prove commits over TCP: legacy subjective consensus
# (-objective=false), -min-rep 100, -quorum 1, a real 8M bond, fast -bond-audit
# so standing warms in seconds. Adversary/honest IDs are deterministic
# (-id-seed), so run.sh learns every ID up front with `silt id` and wires the
# `-attesters` / `-forge-block` / `-lowbond-propose` / `-equivocate` targets.
#
# run.sh brings services up SELECTIVELY per scenario (compose profiles), so the
# equivocation topology (H1/H2 + adversary double-signing both) and the
# forged/low-bond topology (a fresh honest target H3 + one crafted proposal) do
# not cross-contaminate.
#
# TWO SEATS ARE PINNED TO THE DECLARED FLOOR SPEC — one core, 2 GiB, no swap:
# `equiv-x`, the honest detector that has to hold two conflicting chains and
# reconcile them, and `h3`, the honest target the crafted proposals are aimed
# at. They are the seats the adversaries actually feed, and they are the seats
# this suite already asserts from, so the attack lands where the assertions are
# watching. That makes the claim measurable here: silt stays under its memory
# ceiling on ADVERSARIAL input, not merely on honest consensus traffic.
#
# The limits are a cgroup and not the daemon's `-mem-limit`, because
# `-mem-limit` is a SOFT ceiling (it sets runtime/debug.SetMemoryLimit, so the
# GC reclaims harder as the heap climbs) and a soft ceiling cannot answer "does
# this node survive on a 2 GiB box". `memswap_limit` equal to `mem_limit` means
# no swap at all, so crossing the ceiling is a clean OOM-kill the harness can
# read rather than a thrash it would have to guess about. `cpuset` and not a CPU
# quota, because a quota still reports every host core to `nproc` and the Go
# runtime would size GOMAXPROCS for a box wider than the one that ships. The two
# pinned seats never run at the same time — run.sh removes the equivocation
# topology before the proposal topology comes up — so they share `cpuset: "0"`.
#
# The soft `-mem-limit=1500M` rides ALONGSIDE the hard ceiling on those seats,
# because it is part of the floor-box configuration the product ships: the GC
# gets a chance to act before the kernel does.

networks:
  rt:
    driver: bridge
    ipam:
      config: [{ subnet: 10.110.0.0/24 }]

# The bond audit (challenge peers, refresh own standing) runs every 1s so
# earned standing crosses the -min-rep 100 bar within a few seconds — the same
# knob the e2e accountability tests use.
x-honest: &honest
  image: silt-redteam
  networks: [rt]

services:
  # ── POSITIVE CONTROL — the honest quorum ─────────────────────────────────
  # H1 and H2 are two honest, mutually-auditing validators. On their own they
  # earn standing and commit a normal block (positive control: the quorum is
  # otherwise healthy, so a later rejection is a real defence, not a dead swarm).
  # H1 also serves the registry so a publish can commit.
  h1:
    <<: *honest
    command:
      - silt
      - daemon
      - -id-seed=1
      - -listen=0.0.0.0:4001
      - -advertise=10.110.0.11:4001
      - -serve-registry=0.0.0.0:4003
      - -store=/data
      - -validator
      - -objective=false
      - -min-rep=100
      - -quorum=1
      - -attesters=${ID_H2:-unset}
      - -bond=8M
      - -bond-audit=1s
      - -capacity=1G
      - -mdns=false
      - -debug
    networks:
      rt:
        ipv4_address: 10.110.0.11

  h2:
    <<: *honest
    command:
      - silt
      - daemon
      - -id-seed=2
      - -listen=0.0.0.0:4001
      - -advertise=10.110.0.12:4001
      - -store=/data
      - -validator
      - -objective=false
      - -min-rep=100
      - -quorum=1
      - -attesters=${ID_H1:-unset}
      - -bootstrap=${ID_H1:-unset}@10.110.0.11:4001
      - -bond=8M
      - -bond-audit=1s
      - -capacity=1G
      - -mdns=false
      - -debug
    networks:
      rt:
        ipv4_address: 10.110.0.12

  # ── Scenario 1: EQUIVOCATOR ──────────────────────────────────────────────
  # The SUBJECTIVE (reputation) double-sign drill, decoupled from the positive
  # control so the topologies don't cross-contaminate. It is NOT the same drill as
  # e2e/equivocation_test.go: that one runs OBJECTIVE, 3-of-4, and serves its fork
  # on GetChain (-equivocate objective), because a BFT commit floor makes a fork
  # impossible to drive onto a target. This lane drives the forks IN at quorum 1,
  # which is the only place that placement path is exercised end to end. The
  # in-process gates are core/node/adversary_era_mint_test.go (placement at the
  # shipped era) and the three wedge tests beside it.
  #  equiv-a (adversary, bootstrap ANCHOR): -attesters "idX,idYZ",
  #  -equivocate "idX,idYZ". Once it has earned standing with BOTH, it
  #  double-signs — block X onto equiv-x, heavier fork (Y,Z) onto equiv-yz.
  #  equiv-x (honest DETECTOR): holds A's block X, -attesters idYZ so it SYNCS
  #  the heavier Y,Z fork from equiv-yz, reconciles, catches A signing
  #  two blocks at height 1, and SLASHES A.
  #  equiv-yz (honest recipient of the heavier fork): NO -attesters, so it never
  #  syncs the X-fork and stays a clean recipient of Y,Z.
  # equiv-a is the anchor both honest nodes bootstrap off, so A directly
  # exchanges bond challenges with both and earns standing with each.
  equiv-a:
    <<: *honest
    profiles: [equiv]
    command:
      - silt
      - daemon
      - -id-seed=6001
      - -listen=0.0.0.0:4001
      - -advertise=10.110.0.21:4001
      - -store=/data
      - -validator
      - -objective=false
      - -min-rep=100
      - -quorum=1
      - -attesters=${ID_EQUIV_X:-unset},${ID_EQUIV_YZ:-unset}
      - -equivocate=${ID_EQUIV_X:-unset},${ID_EQUIV_YZ:-unset}
      - -bond=8M
      - -bond-audit=1s
      - -capacity=1G
      - -mdns=false
      - -debug
    networks:
      rt:
        ipv4_address: 10.110.0.21

  equiv-x:
    <<: *honest
    profiles: [equiv]
    command:
      - silt
      - daemon
      - -id-seed=6002
      - -listen=0.0.0.0:4001
      - -advertise=10.110.0.22:4001
      - -store=/data
      - -validator
      - -objective=false
      - -min-rep=100
      - -quorum=1
      - -attesters=${ID_EQUIV_YZ:-unset}
      - -bootstrap=${ID_EQUIV_A:-unset}@10.110.0.21:4001
      - -bond=8M
      - -bond-audit=1s
      - -capacity=1G
      - -mem-limit=1500M
      - -mdns=false
      - -debug
    cpuset: "0"
    mem_limit: 2g
    memswap_limit: 2g
    networks:
      rt:
        ipv4_address: 10.110.0.22

  equiv-yz:
    <<: *honest
    profiles: [equiv]
    command:
      - silt
      - daemon
      - -id-seed=6003
      - -listen=0.0.0.0:4001
      - -advertise=10.110.0.23:4001
      - -store=/data
      - -validator
      - -objective=false
      - -min-rep=100
      - -quorum=1
      - -bootstrap=${ID_EQUIV_A:-unset}@10.110.0.21:4001
      - -bond=8M
      - -bond-audit=1s
      - -capacity=1G
      - -mdns=false
      - -debug
    networks:
      rt:
        ipv4_address: 10.110.0.23

  # ── Scenarios 2 & 3: FORGED BLOCK and LOW-BOND PROPOSE ───────────────────
  # H3 is a fresh honest target (its own store). The forger and the low-bond
  # proposer each send ONE crafted proposal to H3 and report whether H3 refused
  # it. Mirrors e2e/proposal_reject_test.go:
  #  forger: -forge-block idH3 (corrupted proposer signature)
  #  lowbond: -bond 128K -lowbond-propose idH3 (under-bonded proposer)
  h3:
    <<: *honest
    profiles: [propose]
    command:
      - silt
      - daemon
      - -id-seed=8001
      - -listen=0.0.0.0:4001
      - -advertise=10.110.0.31:4001
      - -store=/data
      - -validator
      - -objective=false
      - -min-rep=100
      - -quorum=1
      - -bond=8M
      - -bond-audit=1s
      - -capacity=1G
      - -mem-limit=1500M
      - -mdns=false
      - -debug
    cpuset: "0"
    mem_limit: 2g
    memswap_limit: 2g
    networks:
      rt:
        ipv4_address: 10.110.0.31

  forger:
    <<: *honest
    profiles: [propose]
    command:
      - silt
      - daemon
      - -id-seed=8002
      - -listen=0.0.0.0:4001
      - -advertise=10.110.0.32:4001
      - -store=/data
      - -validator
      - -objective=false
      - -min-rep=100
      - -quorum=1
      - -forge-block=${ID_H3:-unset}
      - -bootstrap=${ID_H3:-unset}@10.110.0.31:4001
      - -bond=8M
      - -bond-audit=1s
      - -capacity=1G
      - -mdns=false
      - -debug
    networks:
      rt:
        ipv4_address: 10.110.0.32

  lowbond:
    <<: *honest
    profiles: [propose]
    command:
      - silt
      - daemon
      - -id-seed=8004
      - -listen=0.0.0.0:4001
      - -advertise=10.110.0.33:4001
      - -store=/data
      - -validator
      - -objective=false
      - -min-rep=100
      - -quorum=1
      - -lowbond-propose=${ID_H3:-unset}
      - -bootstrap=${ID_H3:-unset}@10.110.0.31:4001
      # A tiny 128K bond, far below the -min-rep 100 bar — the proposal is
      # otherwise well-formed and correctly signed, so the ONLY reason for
      # refusal is the insufficient bond. Opt out of the anti-release floor so
      # the sub-floor bond is accepted onto the plot at all.
      - -bond=128K
      - -min-bond-floor=0
      - -bond-audit=1s
      - -capacity=1G
      - -mdns=false
      - -debug
    networks:
      rt:
        ipv4_address: 10.110.0.33

  # goodprop is the POSITIVE CONTROL (audit): a properly 8M-bonded proposer —
  # identical to `forger` but with a WELL-FORMED proposal — whose block H3 MUST
  # accept once its bond earns standing. Gating SCENARIO 2 & 3 on this proves H3
  # attests a valid bonded block, so its REJECTION of the forged/under-bonded ones
  # is the real defence firing, not a target that refuses everything.
  goodprop:
    <<: *honest
    profiles: [propose]
    command:
      - silt
      - daemon
      - -id-seed=8006
      - -listen=0.0.0.0:4001
      - -advertise=10.110.0.34:4001
      - -store=/data
      - -validator
      - -objective=false
      - -min-rep=100
      - -quorum=1
      - -goodpropose=${ID_H3:-unset}
      - -bootstrap=${ID_H3:-unset}@10.110.0.31:4001
      - -bond=8M
      - -bond-audit=1s
      - -capacity=1G
      - -mdns=false
      - -debug
    networks:
      rt:
        ipv4_address: 10.110.0.34
