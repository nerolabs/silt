# C2 — "no quiet capture": a bonded Sybil validator set tries to take over a
# YOUNG objective network, on one flat Docker net.
#
#  a1 (10.90.0.2) honest anchor + registry + the normal proposer. Has genesis
#  standing (a launch anchor), so it bootstraps the chain and its
#  blocks COMMIT the Sybils' bond registrations (giving them real
#  on-chain standing — so the capture attempt below is blocked by
#  the ANCHOR gate, not merely by "no reputation yet").
#  a2 (10.90.0.3) the second honest anchor. It attests a1's blocks, so each commit
#  carries BOTH anchors (a1 proposer + a2 attester = 2). Under the
#  launch gate is a DERIVED strict anchor majority ⌊A/2⌋+1 in objective
#  mode (=2 for these 2 anchors), so -anchor-quorum is IGNORED here — the
#  two-anchor commit satisfies the derived rule, and a Sybil now cannot
#  even PROPOSE during launch (anchor-only proposing, encoding B), a
#  stronger form of the same C2 barrier.
#  s1 (10.90.0.4) a Sybil validator that ALSO serves a registry — the capture
#  target. Once bootstrapped it has real bonded standing, then
#  tries to commit WITHOUT an anchor.
#  s2 (10.90.0.5) a second Sybil (s1's non-anchor quorum peer).
#  sybil×N extra equal-bond Sybil identities (same domain) — the split
#  the C2 metric must read as a fingerprint, not decentralization.
#
# The Sybils are NOT anchors. So even bonded and quorum-complete they cannot commit
# while the network is young without an anchor — chain: ErrAnchorRequired. That is
# C2. role.sh self-advertises each container's routable IP.
#
# a1 IS PINNED TO THE DECLARED FLOOR SPEC — one core, 2 GiB, no swap. It is the
# honest seat the Sybil farm actually feeds: every extra identity submits a bond
# registration for a1 to verify, bank and commit, so the farm's size is a1's
# working set. Pinning it makes this topology answer the part of the floor-box
# claim that honest consensus traffic cannot — silt stays under its memory
# ceiling on ADVERSARIAL input, on the smallest box it claims to run on.
#
# The limits are a cgroup and not the daemon's `-mem-limit`, because
# `-mem-limit` is a SOFT ceiling (it sets runtime/debug.SetMemoryLimit, so the
# GC reclaims harder as the heap climbs) and a soft ceiling cannot answer "does
# this node survive on a 2 GiB box". `memswap_limit` equal to `mem_limit` means
# no swap at all, so crossing the ceiling is a clean OOM-kill the harness can
# read rather than a thrash it would have to guess about. `cpuset` and not a CPU
# quota, because a quota still reports every host core to `nproc` and the Go
# runtime would size GOMAXPROCS for a box wider than the one that ships.
#
# The soft `-mem-limit=1500M` rides ALONGSIDE the hard ceiling, because it is
# part of the floor-box configuration the product ships: the GC gets a chance to
# act before the kernel does.

networks:
  swarm:
    driver: bridge
    ipam:
      config: [{ subnet: 10.90.0.0/24 }]

x-valdefaults: &valdefaults
  image: silt-sybil
  entrypoint: ["role.sh"]

services:
  a1:
    <<: *valdefaults
    command:
      - silt
      - daemon
      - -id-seed=5001
      - -listen=0.0.0.0:4001
      - -serve-registry=0.0.0.0:4003
      - -store=/data
      - -validator
      - -anchors=${A1_ID:-x},${A2_ID:-x}
      - -anchor-quorum=1
      - -mature-validators=99            # young forever here: the anchor gate is the property under test
      - -min-rep=100
      - -quorum=1
      - -min-bond=1M
      - -min-bond-floor=0
      - -byzantine-quorum=false
      - -attesters=${A2_ID:-x}
      - -bond=8M
      - -bond-audit=1s
      - -domain=honest
      - -capacity=1G
      - -mem-limit=1500M
      - -mdns=false
      - -log=info
    cpuset: "0"
    mem_limit: 2g
    memswap_limit: 2g
    networks:
      swarm: { ipv4_address: 10.90.0.2 }

  a2:
    <<: *valdefaults
    command:
      - silt
      - daemon
      - -id-seed=5002
      - -listen=0.0.0.0:4001
      - -store=/data
      - -validator
      - -anchors=${A1_ID:-x},${A2_ID:-x}
      - -anchor-quorum=1
      - -mature-validators=99
      - -min-rep=100
      - -quorum=1
      - -min-bond=1M
      - -min-bond-floor=0
      - -byzantine-quorum=false
      - -attesters=${A1_ID:-x}
      - -bootstrap=${A1_ID:-x}@10.90.0.2:4001
      - -bond=8M
      - -bond-audit=1s
      - -domain=honest2
      - -capacity=1G
      - -mdns=false
      - -log=info
    networks:
      swarm: { ipv4_address: 10.90.0.3 }

  s1:
    <<: *valdefaults
    command:
      - silt
      - daemon
      - -id-seed=5003
      - -listen=0.0.0.0:4001
      - -serve-registry=0.0.0.0:4003
      - -store=/data
      - -validator
      - -anchors=${A1_ID:-x},${A2_ID:-x}
      - -anchor-quorum=1
      - -mature-validators=99
      - -min-rep=100
      - -quorum=1
      - -min-bond=1M
      - -min-bond-floor=0
      - -byzantine-quorum=false
      - -attesters=${A1_ID:-x},${A2_ID:-x},${S2_ID:-x}
      - -bootstrap=${A1_ID:-x}@10.90.0.2:4001
      - -bond=8M
      - -bond-audit=1s
      - -domain=sybilfarm
      - -capacity=1G
      - -mdns=false
      - -log=info
    networks:
      swarm: { ipv4_address: 10.90.0.4 }

  s2:
    <<: *valdefaults
    command:
      - silt
      - daemon
      - -id-seed=5004
      - -listen=0.0.0.0:4001
      - -store=/data
      - -validator
      - -anchors=${A1_ID:-x},${A2_ID:-x}
      - -anchor-quorum=1
      - -mature-validators=99
      - -min-rep=100
      - -quorum=1
      - -min-bond=1M
      - -min-bond-floor=0
      - -byzantine-quorum=false
      - -attesters=${A1_ID:-x},${A2_ID:-x},${S1_ID:-x}
      - -bootstrap=${A1_ID:-x}@10.90.0.2:4001
      - -bond=8M
      - -bond-audit=1s
      - -domain=sybilfarm
      - -capacity=1G
      - -mdns=false
      - -log=info
    networks:
      swarm: { ipv4_address: 10.90.0.5 }

  # Extra bonded Sybil identities (random IDs — a real Sybil farm is many keys),
  # same domain + equal bond, to push the committed bond ledger past the ≥8-bond
  # atomization-note threshold. They attest s1 so their bonds are submitted.
  sybil:
    <<: *valdefaults
    command:
      - silt
      - daemon
      - -listen=0.0.0.0:4001
      - -store=/data
      - -validator
      - -anchors=${A1_ID:-x},${A2_ID:-x}
      - -anchor-quorum=1
      - -mature-validators=99
      - -min-rep=100
      - -quorum=1
      - -min-bond=1M
      - -min-bond-floor=0
      - -byzantine-quorum=false
      - -attesters=${A1_ID:-x},${A2_ID:-x},${S1_ID:-x}
      - -bootstrap=${A1_ID:-x}@10.90.0.2:4001
      - -bond=8M
      - -bond-audit=1s
      - -domain=sybilfarm
      - -capacity=1G
      - -mdns=false
      - -log=info
    networks: [swarm]
